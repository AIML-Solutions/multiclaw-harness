name: MultiClaw Harness gate
description: Score agent trajectories against a golden set and fail the job when behavior regresses.
author: AIML Solutions
branding:
  icon: shield
  color: green

inputs:
  pack:
    description: Pack directory holding golden_cases.jsonl, baseline_run.jsonl and optional candidate_run.jsonl.
    required: false
    default: ""
  golden:
    description: Golden cases JSONL (overrides the pack's).
    required: false
    default: ""
  run:
    description: Run traces JSONL to score; the baseline when compare-run is set (overrides the pack's).
    required: false
    default: ""
  compare-run:
    description: Candidate run traces JSONL to gate and compare against run (overrides the pack's).
    required: false
    default: ""
  min-pass-rate:
    description: Minimum case pass rate.
    required: false
    default: "0.95"
  min-overall:
    description: Minimum mean overall score.
    required: false
    default: "0.90"
  max-forbidden-hits:
    description: Forbidden tool calls tolerated in total.
    required: false
    default: "0"
  allow-regressions:
    description: Set to "true" to not fail on regressions vs the baseline.
    required: false
    default: "false"
  json-out:
    description: Where to write the JSON report.
    required: false
    default: multiclaw-report/scorecard.json
  md-out:
    description: Where to write the Markdown scorecard (also appended to the job summary).
    required: false
    default: multiclaw-report/scorecard.md
  fail-on-gate:
    description: Set to "false" to report a failed gate through outputs instead of failing the step.
    required: false
    default: "true"
  python-version:
    description: Python to install with actions/setup-python; set to "" to use the runner's python.
    required: false
    default: "3.13"

outputs:
  passed:
    description: '"true" if the gate passed, otherwise "false".'
    value: ${{ steps.gate.outputs.passed }}
  exit-code:
    description: 0 gate passed, 1 gate failed, 2 invalid input.
    value: ${{ steps.gate.outputs.exit-code }}
  json-report:
    description: Path of the JSON report.
    value: ${{ inputs.json-out }}
  md-report:
    description: Path of the Markdown scorecard.
    value: ${{ inputs.md-out }}

runs:
  using: composite
  steps:
    - if: inputs.python-version != ''
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install MultiClaw Harness
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"

    - name: Run gate
      id: gate
      shell: bash
      env:
        INPUT_PACK: ${{ inputs.pack }}
        INPUT_GOLDEN: ${{ inputs.golden }}
        INPUT_RUN: ${{ inputs.run }}
        INPUT_COMPARE_RUN: ${{ inputs.compare-run }}
        INPUT_MIN_PASS_RATE: ${{ inputs.min-pass-rate }}
        INPUT_MIN_OVERALL: ${{ inputs.min-overall }}
        INPUT_MAX_FORBIDDEN_HITS: ${{ inputs.max-forbidden-hits }}
        INPUT_ALLOW_REGRESSIONS: ${{ inputs.allow-regressions }}
        INPUT_JSON_OUT: ${{ inputs.json-out }}
        INPUT_MD_OUT: ${{ inputs.md-out }}
        INPUT_FAIL_ON_GATE: ${{ inputs.fail-on-gate }}
      run: |
        args=(
          --min-pass-rate "$INPUT_MIN_PASS_RATE"
          --min-overall "$INPUT_MIN_OVERALL"
          --max-forbidden-hits "$INPUT_MAX_FORBIDDEN_HITS"
          --json-out "$INPUT_JSON_OUT"
          --md-out "$INPUT_MD_OUT"
        )
        if [ -n "$INPUT_PACK" ]; then args+=(--pack "$INPUT_PACK"); fi
        if [ -n "$INPUT_GOLDEN" ]; then args+=(--golden "$INPUT_GOLDEN"); fi
        if [ -n "$INPUT_RUN" ]; then args+=(--run "$INPUT_RUN"); fi
        if [ -n "$INPUT_COMPARE_RUN" ]; then args+=(--compare-run "$INPUT_COMPARE_RUN"); fi
        if [ "$INPUT_ALLOW_REGRESSIONS" = "true" ]; then args+=(--allow-regressions); fi

        set +e
        multiclaw-harness "${args[@]}"
        code=$?
        set -e

        if [ "$code" -le 1 ] && [ -f "$INPUT_MD_OUT" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          cat "$INPUT_MD_OUT" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi

        if [ "$code" -eq 1 ]; then
          echo "::error title=MultiClaw Harness::Gate failed; see the job summary for the scorecard."
          if [ "$INPUT_FAIL_ON_GATE" = "true" ]; then exit 1; fi
        elif [ "$code" -ne 0 ]; then
          echo "::error title=MultiClaw Harness::Invalid harness input (exit $code)."
          exit "$code"
        fi
